<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ambient Soundtrack demo</title>
<style>
  :root{--paper:#f4ead3;--ink:#3b2f24;--soft:#6e5c48;--pink:#c2546f;--rule:#d9c49b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}
  main{max-width:560px;margin:0 auto;padding:28px 16px 48px}
  h1{font-size:28px;margin:0 0 4px}
  p.sub{margin:0 0 20px;color:var(--soft);font-style:italic}
  button{font:600 16px Georgia,serif;color:var(--ink);background:#fff8e6;border:1.5px solid var(--ink);border-radius:10px;padding:9px 18px;cursor:pointer}
  button.big{font-size:20px;padding:12px 26px;background:var(--pink);color:#fff8e6;border-color:#8e2f48}
  h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);border-bottom:1px solid var(--rule);padding-bottom:4px;margin:26px 0 8px}
  .row{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;padding:3px 0}
  .row output{font-size:13px;color:var(--soft);text-align:right}
  input[type=range]{width:100%;accent-color:var(--pink)}
  .render{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  select{font:16px Georgia,serif;padding:7px;border:1.5px solid var(--ink);border-radius:8px;background:#fff8e6;color:var(--ink)}
  #status{font-size:14px;color:var(--soft)}
  a#dl{font-weight:600;color:var(--pink)}
  @media (max-width:480px){.row{grid-template-columns:110px 1fr 42px}}
</style>
</head>
<body>
<main>
  <h1>Ambient Soundtrack</h1>
  <p class="sub">Generated live in your browser. It never plays the same way twice.</p>
  <button class="big" id="play">▶ Play</button>

  <h2>Levels</h2><div id="levels"></div>
  <h2>Feel</h2><div id="feel"></div>
  <p><button id="reset">Reset mixer</button></p>

  <h2>Render a file</h2>
  <div class="render">
    <select id="mins"><option value="1">1 minute</option><option value="5" selected>5 minutes</option><option value="10">10 minutes</option></select>
    <button id="render">Render WAV</button> <a id="dl" hidden></a>
  </div>
  <p id="status">Uses the mixer settings above. Rendering runs faster than real time, but long files take a moment.</p>
</main>
<script src="ambient-soundtrack.js"></script>
<script>
  const music=AmbientSoundtrack.create();
  const LEV=[['master','Everything'],['piano','Piano'],['mech','Pedal & hammers'],['strings','Strings'],['winds','Low woodwinds'],['room','Room tone'],['grain','Tape grain'],['hall','Concert hall']];
  const FEEL=[['tempo','Tempo',.6,1.4],['notes','Busy-ness',0,1],['warmth','Warmth',0,1],['space','Room size',0,1]];
  const row=(k,l,a,b)=>`<label class="row"><span>${l}</span><input type="range" min="${a}" max="${b}" step=".01" data-k="${k}" value="${music.get(k)}"><output>${Math.round(music.get(k)*100)}%</output></label>`;
  document.getElementById('levels').innerHTML=LEV.map(([k,l])=>row(k,l,0,1.5)).join('');
  document.getElementById('feel').innerHTML=FEEL.map(([k,l,a,b])=>row(k,l,a,b)).join('');
  document.querySelectorAll('input[type=range]').forEach(i=>i.addEventListener('input',()=>{ music.set(i.dataset.k,+i.value); i.nextElementSibling.textContent=Math.round(i.value*100)+'%'; }));
  document.getElementById('reset').onclick=()=>{ music.reset(); document.querySelectorAll('input[type=range]').forEach(i=>{ i.value=music.get(i.dataset.k); i.nextElementSibling.textContent=Math.round(i.value*100)+'%'; }); };
  const play=document.getElementById('play');
  play.onclick=async()=>{ if(music.isPlaying()){ music.stop(); play.textContent='▶ Play'; } else { await music.start(); play.textContent='❚❚ Pause'; } };
  document.getElementById('render').onclick=async()=>{
    const m=+document.getElementById('mins').value, st=document.getElementById('status'), a=document.getElementById('dl');
    st.textContent=`Rendering ${m} minute${m>1?'s':''}…`; a.hidden=true;
    try{ const blob=await AmbientSoundtrack.renderWav(m*60,music.settings());
      if(a.href) URL.revokeObjectURL(a.href); a.href=URL.createObjectURL(blob); a.download=`ambient-soundtrack-${m}min.wav`; a.textContent=`Download ${a.download} (${(blob.size/1048576).toFixed(0)} MB)`; a.hidden=false; st.textContent='Done.';
    }catch(e){ st.textContent='Could not render: '+e.message; }
  };
</script>
</body>
</html>
