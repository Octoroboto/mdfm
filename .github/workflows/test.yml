# Runs the MDFM tests and the MDFM Radio and MD Hub app tests on every push and every Dependabot pull request.
name: tests
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: node scripts/build.mjs
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: apps/radio
      - run: npm test
        working-directory: apps/radio
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: apps/hub
      - run: npm test
        working-directory: apps/hub
      - run: npm test
        working-directory: apps/slack-relay
