<!doctype html><html><head><meta charset="utf-8"><title>MDFM demo</title>
<link rel="stylesheet" href="../dist/skin.css">
<style>body{background:#15161c;color:#e4e4ec;font:15px system-ui;padding:24px}canvas{width:420px;height:110px;background:#000;display:block;margin:12px 0;border:2px solid #333}button{font:inherit;padding:8px 14px;margin-right:6px}</style></head>
<body><h1>MDFM 99.9 HD</h1>
<canvas id="eq"></canvas>
<button id="go">Play / stop</button><button id="skip">Next song</button><button id="spot">Ad now</button><button id="ride">Let it ride</button><button id="uw">Underwater</button>
<p id="np">Off</p>
<footer data-mdfm-badges></footer>
<script src="../dist/skin.js"></script>
<script type="module">
import { createMDFM, mountEQ } from "../dist/mdfm.mjs";
import examplePack from "../packs/example-pack.js";
const radio = createMDFM({ packs: [examplePack], techNews: async () => ({ items: [{automation:"PICS",app:"Analyze Pics",kind:"suggestion",title:"Auto-post the Dropbox comparison folder to Slack after each run",summary:"When a comparison finishes, Slack gets the folder link.",when:Date.now()-864e5},{automation:"TATEY",app:"Lil Tatey",event:"done",title:"Removal detector retrained",when:Date.now()-2*864e5},{automation:"SPUD",app:"Spudmuffin",kind:"problem",title:"Old item",when:Date.now()-30*864e5}] }) });
window.radio = radio;
mountEQ(document.getElementById("eq"), radio);
radio.on("nowplaying", s => document.getElementById("np").textContent = `Now playing: “${s.title}” (${s.style}, ${s.bpm} BPM)`);
radio.on("spot", s => console.log("spot:", s.text));
document.getElementById("go").onclick = () => radio.toggle();
document.getElementById("skip").onclick = () => radio.skip();
document.getElementById("spot").onclick = () => radio.spotNow();
document.getElementById("ride").onclick = e => { radio.setLetItRide(!radio.isLetItRide()); e.target.textContent = radio.isLetItRide() ? "Let it ride: on" : "Let it ride"; };
document.getElementById("uw").onclick = e => { radio.setUnderwater(!radio.isUnderwater()); e.target.textContent = radio.isUnderwater() ? "Underwater: on" : "Underwater"; };
</script></body></html>
